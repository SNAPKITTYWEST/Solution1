# Sovereign behind nginx.
#
# Use this when TLS is terminated by nginx rather than Caddy. The only
# host-specific edits are the server_name and the certificate paths.
#
# With nginx in front, the service must be told it is behind a proxy. The
# systemd unit in sovereign.service sets:
#     SOVEREIGN_BIND=http://127.0.0.1:5080
#     SOVEREIGN_ALLOWED_ORIGIN=https://sovereign.example.com
#     SOVEREIGN_WEB_ROOT=/opt/sovereign/dist
#     SOVEREIGN_SAML_ACS=https://sovereign.example.com/saml/acs
#   and the host reads X-Forwarded-Proto, so the session cookie is issued Secure.

upstream sovereign {
    server 127.0.0.1:5080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sovereign.example.com;

    # ACME challenges stay on plain HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sovereign.example.com;

    ssl_certificate     /etc/letsencrypt/live/sovereign.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereign.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The assertion consumer is a form POST from the identity provider.
    client_max_body_size 2m;

    location / {
        proxy_pass http://sovereign;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Token lifetimes are 15 minutes, so nothing should be cached.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}

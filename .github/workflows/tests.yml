name: Runtime and browser tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm ci
      - run: dotnet build Solution1.sln -c Release
      - run: dotnet run --project Sovereign.Tests -c Release --no-build
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-playground
          path: artifacts/*.png
